<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="hw01.css">
</head>

<body>

    <div class="mainDiv">
        <div class="leftDIv">
            <p id="temperature"></p>
            <div>
                <h1 id="cityName"></h1>
                <p id="data"></p>
            </div>
            <img src="img/cloud.png" alt="">
        </div>

        <div class="rightDiv">
            <div class="searchDiv">
                <form id="form">
                    <input type="text" id="cityInp" name="city" placeholder="Search Location...">
                    <button type="submit"><img src="img/search.png" alt=""></button>
                </form>
                <h2>Weather Details...</h2>
            </div>
            <h2 class="boxtitle">THUNDERSTORM WITH LIGHT DRIZZLE</h2>
            <div class="boxDiv">

                <div class="box">
                    <h2>Temp C</h2>
                    <div>
                        <p id="temperatureC"></p>
                        <img id="imgC" src="" alt="">
                    </div>
                </div>
                <div class="box">
                    <h2>Temp F</h2>
                    <div>
                        <p id="temperatureF"></p>
                        <img id="imgF" src="" alt="">
                    </div>

                </div>
                <div class="box">
                    <h2>Cloud</h2>
                    <div>
                        <p id="cloud"></p>
                        <img src="img/water_drop.png" alt="">
                    </div>

                </div>
                <div class="box">
                    <h2>Wind</h2>
                    <div>
                        <p id="wind"></p>
                        <img src="img/air.png" alt="">
                    </div>

                </div>
            </div>

            <!-- <p id="weather"></p> -->

        </div>
    </div>





    <script src="hw01.js"></script>
</body>

</html>
