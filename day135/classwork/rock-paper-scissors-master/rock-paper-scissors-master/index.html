<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Rock, Paper, Scissors</title>

  
</head>
<body>

  <div class="scoreDIV">

    <div>
      <p>SCORE</p>

    </div>
  </div>

      <img id="MYchoice" src="image0.png" alt="">
